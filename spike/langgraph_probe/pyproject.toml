[project]
name = "lg-probe"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["langgraph", "langchain", "langchain-core", "langchain-openai", "langchain-deepseek"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_probe"]
